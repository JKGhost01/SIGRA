<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGRA · Sin conexión</title>
<style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #f5f8f7; color: #172329; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width: 520px; padding: 2rem; border: 1px solid #dfe7e5; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px rgba(23,35,41,.08); }
    .dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; background: #d97706; margin-right: .4rem; }
    h1 { margin: 0 0 .6rem; font-size: 1.6rem; }
    p { color: #6d7b80; line-height: 1.6; }
    a { display: inline-block; margin-top: .8rem; padding: .7rem 1rem; border-radius: 10px; background: #087f78; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
    <p><span class="dot"></span>Sin conexión</p>
    <h1>SIGRA no pudo cargar la red</h1>
    <p>No hay conexión. No se muestran datos ni alertas actuales; cualquier información vista anteriormente puede estar desactualizada. Reconéctate para consultar las fuentes oficiales.</p>
    <a href="/sismos">Reintentar</a>
</main>
</body>
</html>
