name: Documentation correction
description: Report an incorrect command, broken link or unclear explanation
title: "[docs] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or unclear?
      description: Include the command and error if relevant, without credentials or personal data.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
