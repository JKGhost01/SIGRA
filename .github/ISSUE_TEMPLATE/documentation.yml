name: Corrección de documentación
description: Informa de un comando incorrecto, enlace roto o explicación confusa
title: "[docs] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Archivo o sección
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué es incorrecto o poco claro?
      description: Incluye el comando y error pertinentes, sin credenciales ni datos personales.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Corrección sugerida
