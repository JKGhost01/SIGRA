name: Propuesta de mejora
description: Propón una mejora o una nueva fuente de datos
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema u oportunidad
      description: ¿Qué falta o dificulta el uso actual?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solución propuesta
      description: Describe el comportamiento deseado, incluidos cambios de API o interfaz.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Ingesta de datos / nueva fuente
        - Mapa y filtro de radio
        - Histórico y detalle
        - API
        - Red ciudadana
        - Aplicación Android
        - Documentación
        - Otra
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: Revisé los issues y debates existentes.
          required: true
