name: Reporte de error
description: Informa de un problema reproducible en SIGRA
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar, retira secretos y datos personales de los registros.
  - type: input
    id: version
    attributes:
      label: Versión de SIGRA
      description: Valor de `/api/health` o la etiqueta de la barra de navegación.
      placeholder: "1.4.0.1-beta.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: PHP, base de datos y navegador/sistema (o dispositivo Android).
      placeholder: "PHP 8.2, MariaDB 10.4, Firefox 128 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abre /sismos
        2. Pulsa "Mi ubicación"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Registros relevantes
      description: Fragmentos de `writable/logs/` sin secretos.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: Revisé los issues existentes.
          required: true
        - label: Retiré credenciales y datos personales del reporte.
          required: true
