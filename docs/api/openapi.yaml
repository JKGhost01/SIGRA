      operationId: listEventsLegacy
      tags:
      - SeismicCatalog
      security:
      - BearerToken: []
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 336
          default: 120
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 300
      - name: min_magnitude
        in: query
        required: false
        schema:
          type: number
          minimum: -2
          maximum: 10
      - name: fuente
        in: query
        required: false
        schema:
          type: string
      - name: lat
        in: query
        required: false
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: radius_km
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 20000
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - fecha
          - magnitud
          - distancia
          default: fecha
      responses:
        '200':
          description: Respuesta JSON
          headers:
            X-Request-ID:
              schema:
                type: string
            X-SIGRA-Version:
              schema:
                type: string
            X-API-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentEvents'
        '400':
