components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
    AppKey:
      type: apiKey
      in: header
      name: X-SIGRA-KEY
    DeviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
  schemas:
    LegacyError:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        message:
          type: string
      required:
      - status
      - message
    Error:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
        request_id:
          type: string
      required:
      - status
      - error
      - request_id
    NetworkResult:
      type: object
      description: Campos de éxito heredados, detallados en docs/API_RED.md. No contiene credenciales de servidor.
      additionalProperties: true
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        service:
          type: string
        version:
          type: string
        build:
          type: string
        api_version:
          type: string
        database:
          type: string
          enum:
          - ok
          - error
        time:
          type: string
          format: date-time
      required:
      - status
      - service
      - version
    SeismicEvent:
      type: object
      properties:
        id:
          type: string
        citizen_reports_count:
          type: integer
        source_id:
          type: string
        ubicacion:
          type: string
        latitud:
          type: number
        longitud:
          type: number
        magnitud:
          type: number
        profundidad:
          type: number
        fecha:
          type: string
        fecha_iso:
          type: string
          nullable: true
        distancia_km:
          type: number
          nullable: true
        alerta:
          type: string
        nivel:
          type: integer
        estado:
          type: string
        fuente:
          type: string
