openapi: 3.0.3
info:
  title: SIGRA backend API
  version: v1
  description: Monolito modular. Las rutas legacy conservan sus errores; /api/v1 usa errores estructurados.
    Coordenadas se envían juntas. Radio u orden distancia exige origen. Android está en desarrollo en repositorio
    separado.
servers:
- url: /
paths:
  /api/sismos/recent:
